# nginx returns internal code 497 when plaintext HTTP reaches an HTTPS listener. Redirect it to the
# same hostname/port so typing `localhost:8080` does not show a confusing 400 page.
error_page 497 https://$host:$server_port$request_uri;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_origin $dashboard_origin {
  default invalid;
  '' '';
  'http://dashboard.localhost' 'http://127.0.0.1:9119';
}

server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  listen 8080 ssl default_server;
  server_name localhost 127.0.0.1;
  ssl_certificate /run/secrets/fleet_controller_tls_cert;
  ssl_certificate_key /run/secrets/fleet_controller_tls_key;
  root /usr/share/nginx/html;
  location /signal/ { return 410; }
  location / { try_files $uri /index.html; }
}

server {
  listen 80;
  listen 8080 ssl;
  server_name hermes.localhost;
  ssl_certificate /run/secrets/fleet_controller_tls_cert;
  ssl_certificate_key /run/secrets/fleet_controller_tls_key;
  location = / { return 302 http://dashboard.localhost/; }
  location / {
    if ($http_origin != "") { return 403; }
    proxy_pass http://host.docker.internal:8642;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8642;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}

server {
  listen 80;
  listen 8080 ssl;
  server_name memory.localhost;
  ssl_certificate /run/secrets/fleet_controller_tls_cert;
  ssl_certificate_key /run/secrets/fleet_controller_tls_key;
  location / {
    proxy_pass http://hindsight:9999;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9999;
    proxy_set_header Origin http://127.0.0.1:9999;
    proxy_set_header Referer http://127.0.0.1:9999/;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  listen 8080 ssl;
  server_name code.localhost;
  ssl_certificate /run/secrets/fleet_controller_tls_cert;
  ssl_certificate_key /run/secrets/fleet_controller_tls_key;
  location = /mcp {
    proxy_pass http://coderag:9750/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location / {
    proxy_pass http://coderag:9749;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9749;
    proxy_set_header Origin http://127.0.0.1:9749;
    proxy_set_header Referer http://127.0.0.1:9749/;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name dashboard.localhost;
  access_log off;
  location / {
    if ($dashboard_origin = invalid) { return 403; }
    proxy_pass http://host.docker.internal:9119;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9119;
    proxy_set_header Origin $dashboard_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name memory-api.localhost;
  location / {
    if ($http_origin != "") { return 403; }
    proxy_pass http://hindsight:8888;
    proxy_set_header Host 127.0.0.1:8888;
  }
}
