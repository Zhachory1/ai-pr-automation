# nginx returns internal code 497 when plaintext HTTP reaches an HTTPS listener. Redirect it to the
# same hostname/port so typing `localhost:8080` does not show a confusing 400 page.
error_page 497 https://$host:$server_port$request_uri;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080 ssl default_server;
  server_name localhost 127.0.0.1;
  ssl_certificate /run/secrets/fleet_controller_tls_cert;
  ssl_certificate_key /run/secrets/fleet_controller_tls_key;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
}

server {
  listen 8080 ssl;
  server_name fleet.localhost;
  ssl_certificate /run/secrets/fleet_controller_tls_cert;
  ssl_certificate_key /run/secrets/fleet_controller_tls_key;
  location / {
    proxy_pass https://status:8080;
    proxy_ssl_trusted_certificate /run/secrets/fleet_controller_tls_ca_cert;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 8080 ssl;
  server_name hermes.localhost;
  ssl_certificate /run/secrets/fleet_controller_tls_cert;
  ssl_certificate_key /run/secrets/fleet_controller_tls_key;
  auth_basic "AI PR Automation";
  auth_basic_user_file /run/secrets/ui_basic_auth;
  location / {
    proxy_pass http://host.docker.internal:9119;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9119;
    proxy_set_header Origin http://127.0.0.1:9119;
    proxy_set_header Referer http://127.0.0.1:9119/;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}

server {
