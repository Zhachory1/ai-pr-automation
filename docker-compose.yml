# Agent fleet substrate. See docker/README.md.
# Bring up:  cp .env.example .env  && edit  && scripts/compose.sh up -d --build  && scripts/m0-verify.sh
#
# Optional local sidecars: coderag serves its graph UI and swarmvault watches its mounted vault.
# Both use local-only storage and build from pinned upstream commits in docker/.

name: agent-fleet

services:
  # --- our request tracking ---
  db-requests:
    image: postgres:16
    container_name: fleet-db-requests
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${REQUESTS_DB_USER:-fleet}
      POSTGRES_PASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      POSTGRES_DB: ${REQUESTS_DB_NAME:-fleet}
    ports:
      - "${REQUESTS_DB_PORT:-5432}:5432"
    volumes:
      - requests_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - default
      - status-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REQUESTS_DB_USER:-fleet} -d ${REQUESTS_DB_NAME:-fleet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Re-runs additive upgrade migrations for existing database volumes.
  schema-migrate:
    image: postgres:16
    restart: "no"
    environment:
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
    volumes:
      - ./docker/initdb:/migrations:ro
    # 01-schema.sql is the immutable fresh-install baseline; existing volumes receive upgrades only.
    # $$f is escaped so the shell (not compose) expands the loop var; ${REQUESTS_DB_*} stay for compose.
    command: ["sh", "-ec", "for f in /migrations/0[2-9]-*.sql /migrations/1[0-9]-*.sql; do echo \"applying $$f\"; psql -h db-requests -U ${REQUESTS_DB_USER:-fleet} -d ${REQUESTS_DB_NAME:-fleet} -v ON_ERROR_STOP=1 -f \"$$f\"; done"]
    depends_on:
      db-requests:
        condition: service_healthy

  # --- hindsight: agent memory (network service, HTTP :8888 / UI :9999) ---
  # Structure adopted from vectorize-io/hindsight docker/docker-compose/external-pg.
  hindsight-db:
    # Pinned major. hindsight_pgdata is mounted at the pg18 PGDATA path below; changing this tag
    # WITHOUT migrating orphans data silently (older tags e.g. pg16 use a different PGDATA path).
    image: pgvector/pgvector:pg18
    container_name: fleet-hindsight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight_user}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD}
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight_db}
    volumes:
      - hindsight_pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HINDSIGHT_DB_USER:-hindsight_user}"]
      interval: 5s
      timeout: 3s
      retries: 10

  hindsight:
    # Pin a concrete version before relying on this in M1; :latest is non-reproducible.
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-latest}
    container_name: fleet-hindsight
    restart: unless-stopped
    ports:
      # API remains loopback-visible for operator diagnostics; UI is routed through ui-proxy.
      - "127.0.0.1:8888:8888"
    environment:
      # hindsight needs a keyed LLM provider for fact extraction. Keyless subscription providers
      # (claude-code) do not work headless in a container. Set HINDSIGHT_API_LLM_API_KEY in .env.
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_DATABASE_URL: postgresql://${HINDSIGHT_DB_USER:-hindsight_user}:${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD}@hindsight-db:5432/${HINDSIGHT_DB_NAME:-hindsight_db}
    depends_on:
      hindsight-db:
        condition: service_healthy
    networks:
      - default
      - status-internal
    healthcheck:
      # /health returns 200; root (/) is 404. curl is present in the image (verified).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- hindsight-bank-init: lock fleet-shared to a read-only MCP tool set (one-shot) ---
  # Review/maintain agents have direct MCP retain access and write review-completion junk into the
  # shared bank despite prompt rules; removing retain/sync_retain at the server makes that
  # impossible while keeping recall. Runs once after hindsight is healthy, before any agent starts.
  hindsight-bank-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    environment:
      HINDSIGHT_URL: ${HINDSIGHT_URL:-http://hindsight:8888}
      HINDSIGHT_SHARED_BANK: ${HINDSIGHT_SHARED_BANK:-fleet-shared}
    volumes:
      - ./docker/hindsight-bank-init.sh:/usr/local/bin/hindsight-bank-init:ro
    entrypoint: ["sh", "/usr/local/bin/hindsight-bank-init"]
    depends_on:
      hindsight:
        condition: service_healthy
    networks:
      - default

  # --- coderag: graph UI + internal Streamable HTTP MCP bridge ---
  coderag:
    image: agent-fleet/coderag:${CODERAG_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.coderag
      args:
        CBM_REF: ${CBM_REF:-ffb5ebe9e8ad2763fc6388c001ca8a16ca834d88}
    container_name: fleet-coderag
    restart: unless-stopped
    environment:
      CBM_CACHE_DIR: /cache
      CBM_ALLOWED_ROOT: /code
      CBM_UI_PORT: "9749"
      CODERAG_MCP_PORT: "9750"
    volumes:
      - coderag_cache:/cache
      - ${CODE_ROOT:?set CODE_ROOT}:/code:ro
    command: ["serve-all"]
    expose:
      - "9750"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9750/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Lexical guard for direct Compose use; scripts/compose.sh also resolves host symlinks.
  swarmvault-preflight:
    image: busybox:1.36
    restart: "no"
    environment:
      CODE_ROOT: ${CODE_ROOT:?set CODE_ROOT}
      SWARMVAULT_VAULT: ${SWARMVAULT_VAULT:?set SWARMVAULT_VAULT outside CODE_ROOT}
    volumes:
      - ./docker/swarmvault-preflight.sh:/usr/local/bin/swarmvault-preflight:ro
    command: ["/usr/local/bin/swarmvault-preflight"]

  # --- swarmvault: shared doc vault + continuous inbox watcher ---
  swarmvault-watch:
    image: agent-fleet/swarmvault:${SWARMVAULT_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.swarmvault
      args:
        SWARMVAULT_REF: ${SWARMVAULT_REF:-815412d24298e59e5073ded1ddd6c0e6aee9b91b}
    container_name: fleet-swarmvault-watch
    restart: unless-stopped
    volumes:
      - ${SWARMVAULT_VAULT:?set SWARMVAULT_VAULT outside CODE_ROOT}:/vault
    working_dir: /vault
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/swarmvault.config.json && test -s /vault/state/watcher.pid && kill -0 $$(cat /vault/state/watcher.pid)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      swarmvault-preflight:
        condition: service_completed_successfully

  # --- swarmvault: read-only Streamable HTTP MCP bridge ---
  swarmvault-mcp:
    image: agent-fleet/swarmvault:${SWARMVAULT_VERSION:-latest}
    container_name: fleet-swarmvault-mcp
    restart: unless-stopped
    environment:
      SWARMVAULT_MCP_PORT: "9760"
    volumes:
      - ${SWARMVAULT_VAULT:?set SWARMVAULT_VAULT outside CODE_ROOT}:/vault:ro
    working_dir: /vault
    command: ["serve-mcp"]
    expose:
      - "9760"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9760/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      swarmvault-watch:
        condition: service_healthy

  # --- status: local web view (M3) ---
  # Renders running/queued/recent plus human-review queues. Operator session, CSRF, Origin, Host,
  # and localhost binding protect every control action.
  status:
    image: agent-fleet/status:${STATUS_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.status
    container_name: fleet-status
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      REQUESTS_DB_HOST: db-requests
      REQUESTS_DB_PORT: "5432"
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      PR_PRODUCER_REPOSITORIES: ${PR_PRODUCER_REPOSITORIES:-}
      PR_PRODUCER_ORGS: ${PR_PRODUCER_ORGS:-}
      PR_PRODUCER_ALLOW_ALL_REPOS: ${PR_PRODUCER_ALLOW_ALL_REPOS:-false}
      DOC_WRITE_DAILY_CAP: ${DOC_WRITE_DAILY_CAP:-30}
      DOC_WRITER_STAGE_DIR: /work
      HINDSIGHT_URL: http://hindsight:8888
      HANDOFF_ROOT: ${HANDOFF_ROOT:-/var/empty}   # validate swe-implement handoff submissions against PR-safety server paths
      STATUS_BIND: 0.0.0.0
      FLEET_CONTROLLER_PUBLIC_PORT: ${STATUS_PORT:-8080}
      FLEET_CONTROLLER_USERNAME: ${FLEET_CONTROLLER_USERNAME:-fleet}
      FLEET_CONTROLLER_TRUST_LOCAL_PROXY: "true"
      FLEET_CONTROLLER_SESSION_SECRET_FILE: /run/secrets/fleet_controller_session_secret
      FLEET_CONTROLLER_TLS_CERT_FILE: /run/secrets/fleet_controller_tls_cert
      FLEET_CONTROLLER_TLS_KEY_FILE: /run/secrets/fleet_controller_tls_key
      FLEET_CONTROLLER_SESSION_SECONDS: ${FLEET_CONTROLLER_SESSION_SECONDS:-43200}
    secrets:
      - fleet_controller_tls_ca_cert
      - fleet_controller_session_secret
      - fleet_controller_tls_cert
      - fleet_controller_tls_key
    volumes:
      - ${DOC_WRITER_STAGE_HOST:?set DOC_WRITER_STAGE_HOST to the native Hermes stage directory}:/work:ro
      - ${HANDOFF_ROOT:?set HANDOFF_ROOT to the native Hermes handoff directory}:${HANDOFF_ROOT}:ro
    networks:
      - status-internal
    depends_on:
      db-requests:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully

  hermes-controller:
    image: agent-fleet/hermes-controller:${HERMES_CONTROLLER_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.hermes-controller
    container_name: fleet-hermes-controller
    restart: unless-stopped
    environment:
      PGHOST: db-requests
      PGPORT: "5432"
      PGUSER: ${REQUESTS_DB_USER:-fleet}
      PGDATABASE: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      HERMES_API_KEYS_FILE: /run/secrets/hermes_api_keys
      HERMES_API_BASE_URL: http://host.docker.internal:8642
      HERMES_CONTROLLER_LEASE_SECONDS: ${HERMES_CONTROLLER_LEASE_SECONDS:-120}
      HERMES_CONTROLLER_POLL_SECONDS: ${HERMES_CONTROLLER_POLL_SECONDS:-2}
      DOC_WRITER_STAGE_DIR: /doc-stage
      DOC_WRITER_INBOX_DIR: /doc-inbox
      DOC_WRITER_PUBLICATION_BIN: /app/doc-writer-publication
      PR_SAFETY_SNAPSHOT_ROOT: ${PR_SAFETY_SNAPSHOT_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-snapshots}
      PR_SAFETY_POLICY_PATH: ${PR_SAFETY_POLICY_PATH:-/usr/local/etc/ai-pr-automation/pr-safety-policy-v1.md}
      PR_SAFETY_POLICY_VERSION: ${PR_SAFETY_POLICY_VERSION:-v1}
      PR_SAFETY_POLICY_DIGEST: ${PR_SAFETY_POLICY_DIGEST:-}
      HANDOFF_ROOT: ${HANDOFF_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-handoffs}
      MEMORY_SOURCE_ROOT: /memory-sources
      MEMORY_CURATOR_STATE_DIR: /memory-state
      HERMES_MEMORY_TEAM_URL: ${HERMES_MEMORY_TEAM_URL:-https://rokt-agent-memory.eng.roktinternal.com/mcp/team-ads-success/}
      HERMES_MEMORY_ORG_URL: ${HERMES_MEMORY_ORG_URL:-https://rokt-agent-memory.eng.roktinternal.com/mcp/Rokt%20Builders/}
      HERMES_MEMORY_ORG_NAME_BLOCKLIST: ${HERMES_MEMORY_ORG_NAME_BLOCKLIST:-}
    secrets:
      - hermes_api_keys
    volumes:
      - ${DOC_WRITER_STAGE_HOST:-/Users/Shared/ai-pr-automation-runtime/doc-writer}:/doc-stage
      - ${DOC_WRITER_INBOX_HOST:-/Users/zhach/private-docs/inbox}:/doc-inbox
      - ${PR_SAFETY_SNAPSHOT_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-snapshots}:${PR_SAFETY_SNAPSHOT_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-snapshots}:ro
      - ./policy/pr-safety-policy-v1.md:${PR_SAFETY_POLICY_PATH:-/usr/local/etc/ai-pr-automation/pr-safety-policy-v1.md}:ro
      - ${HANDOFF_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-handoffs}:${HANDOFF_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-handoffs}
      - ${MEMORY_SOURCE_HOST:-/Users/zhach/private-docs}:/memory-sources:ro
      - ${MEMORY_CURATOR_STATE_HOST:-/Users/Shared/ai-pr-automation-runtime/memory-curator}:/memory-state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-requests:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully

  pr-producer-review:
    image: agent-fleet/hermes-controller:${HERMES_CONTROLLER_VERSION:-latest}
    restart: unless-stopped
    command: ["/app/hermes-compose-producer.sh", "review"]
    environment:
      REQUESTS_DB_HOST: db-requests
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      HERMES_AUTHORITY_FILE: /config/authority.yaml
      GITHUB_TOKEN_FILE: /run/secrets/github_read_token
      PRODUCER_INTERVAL_SECONDS: ${PR_PRODUCER_INTERVAL_SECONDS:-300}
    secrets: [github_read_token]
    volumes:
      - ${HERMES_AUTHORITY_FILE:-./agent-config/hermes/authority.example.yaml}:/config/authority.yaml:ro
    depends_on:
      schema-migrate: {condition: service_completed_successfully}

  pr-producer-maintain:
    image: agent-fleet/hermes-controller:${HERMES_CONTROLLER_VERSION:-latest}
    restart: unless-stopped
    command: ["/app/hermes-compose-producer.sh", "maintain"]
    environment:
      REQUESTS_DB_HOST: db-requests
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      HERMES_AUTHORITY_FILE: /config/authority.yaml
      GITHUB_TOKEN_FILE: /run/secrets/github_read_token
      PRODUCER_INTERVAL_SECONDS: ${PR_PRODUCER_INTERVAL_SECONDS:-300}
    secrets: [github_read_token]
    volumes:
      - ${HERMES_AUTHORITY_FILE:-./agent-config/hermes/authority.example.yaml}:/config/authority.yaml:ro
    depends_on:
      schema-migrate: {condition: service_completed_successfully}

  pr-safety-producer:
    image: agent-fleet/hermes-controller:${HERMES_CONTROLLER_VERSION:-latest}
    restart: unless-stopped
    command: ["/app/hermes-compose-producer.sh", "pr-safety"]
    environment:
      REQUESTS_DB_HOST: db-requests
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      HERMES_AUTHORITY_FILE: /config/authority.yaml
      GITHUB_TOKEN_FILE: /run/secrets/github_read_token
      PRODUCER_INTERVAL_SECONDS: ${PR_SAFETY_PRODUCER_INTERVAL_SECONDS:-60}
      PR_SAFETY_MERGED_PR_AUTHORS: ${PR_SAFETY_MERGED_PR_AUTHORS:-roktfleet,brucerokt}
      PR_SAFETY_ALLOWED_ORGS: ${PR_SAFETY_ALLOWED_ORGS:-ROKT}
      PR_SAFETY_SNAPSHOT_ROOT: ${PR_SAFETY_SNAPSHOT_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-snapshots}
      PR_SAFETY_POLICY_ROOT: /usr/local/etc/ai-pr-automation
      PR_SAFETY_POLICY_PATH: ${PR_SAFETY_POLICY_PATH:-/usr/local/etc/ai-pr-automation/pr-safety-policy-v1.md}
      PR_SAFETY_POLICY_VERSION: ${PR_SAFETY_POLICY_VERSION:-v1}
      PR_SAFETY_POLICY_DIGEST: ${PR_SAFETY_POLICY_DIGEST:-}
    secrets: [github_read_token]
    volumes:
      - ${HERMES_AUTHORITY_FILE:-./agent-config/hermes/authority.example.yaml}:/config/authority.yaml:ro
      - ${PR_SAFETY_SNAPSHOT_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-snapshots}:${PR_SAFETY_SNAPSHOT_ROOT:-/Users/Shared/ai-pr-automation-runtime/safety-snapshots}
      - ./policy/pr-safety-policy-v1.md:${PR_SAFETY_POLICY_PATH:-/usr/local/etc/ai-pr-automation/pr-safety-policy-v1.md}:ro
    depends_on:
      schema-migrate: {condition: service_completed_successfully}

  memory-curate-producer:
    image: agent-fleet/hermes-controller:${HERMES_CONTROLLER_VERSION:-latest}
    restart: unless-stopped
    command: ["/app/hermes-compose-producer.sh", "memory"]
    environment:
      REQUESTS_DB_HOST: db-requests
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      PRODUCER_INTERVAL_SECONDS: ${HERMES_MEMORY_CURATE_INTERVAL_SECONDS:-21600}
    depends_on:
      schema-migrate: {condition: service_completed_successfully}

  hermes-api-conformance:
    profiles: ["hermes-api-conformance"]
    image: python:3.11-alpine@sha256:0495f5559318affa673172ec7e35cd0a5213e4aaf4c76d0a66554c0af97b157e
    restart: "no"
    command: ["python3", "/app/hermes-api-conformance.py", "--base-url", "http://host.docker.internal:8642", "--keys-file", "/run/secrets/hermes_api_keys", "--wait-seconds", "60"]
    volumes:
      - ./scripts/hermes-api-conformance.py:/app/hermes-api-conformance.py:ro
    secrets:
      - hermes_api_keys
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: fleet-ui-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STATUS_PORT:-8080}:8080"
    volumes:
      - ./docker/ui-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ui-index.html:/usr/share/nginx/html/index.html:ro
    secrets:
      - fleet_controller_tls_ca_cert
      - fleet_controller_tls_cert
      - fleet_controller_tls_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - status-internal
    depends_on:
      status:
        condition: service_started
      hindsight:
        condition: service_healthy
      coderag:
        condition: service_healthy

networks:
  status-internal:
    internal: true

volumes:
  requests_pgdata:
  hindsight_pgdata:
  coderag_cache:

secrets:
  fleet_controller_tls_ca_cert:
    file: ${FLEET_CONTROLLER_TLS_CA_CERT_FILE:?set FLEET_CONTROLLER_TLS_CA_CERT_FILE}
  fleet_controller_session_secret:
    file: ${FLEET_CONTROLLER_SESSION_SECRET_FILE:?set FLEET_CONTROLLER_SESSION_SECRET_FILE}
  fleet_controller_tls_cert:
    file: ${FLEET_CONTROLLER_TLS_CERT_FILE:?set FLEET_CONTROLLER_TLS_CERT_FILE}
  fleet_controller_tls_key:
    file: ${FLEET_CONTROLLER_TLS_KEY_FILE:?set FLEET_CONTROLLER_TLS_KEY_FILE}
  hermes_api_keys:
    file: ${HERMES_API_KEYS_FILE:?set HERMES_API_KEYS_FILE}
  github_read_token:
    file: ${GITHUB_READ_TOKEN_FILE:-/dev/null}
