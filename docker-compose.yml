# Agent fleet substrate. See docker/README.md.
# Bring up:  cp .env.example .env  && edit  && scripts/compose.sh up -d --build  && scripts/m0-verify.sh
#
# Optional local sidecars: coderag serves its graph UI and swarmvault watches its mounted vault.
# Both use local-only storage and build from pinned upstream commits in docker/.

name: agent-fleet

services:
  # --- our request tracking ---
  db-requests:
    image: postgres:16
    container_name: fleet-db-requests
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${REQUESTS_DB_USER:-fleet}
      POSTGRES_PASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      POSTGRES_DB: ${REQUESTS_DB_NAME:-fleet}
    ports:
      - "${REQUESTS_DB_PORT:-5432}:5432"
    volumes:
      - requests_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REQUESTS_DB_USER:-fleet} -d ${REQUESTS_DB_NAME:-fleet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Re-runs additive migrations for existing database volumes. New volumes receive these files
  # through Postgres initdb before this service verifies the same schema idempotently.
  schema-migrate:
    image: postgres:16
    restart: "no"
    environment:
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
    volumes:
      - ./docker/initdb:/migrations:ro
    command: ["sh", "-ec", "psql -h db-requests -U ${REQUESTS_DB_USER:-fleet} -d ${REQUESTS_DB_NAME:-fleet} -v ON_ERROR_STOP=1 -f /migrations/02-agent-server.sql -f /migrations/03-human-review-queue.sql -f /migrations/04-pending-decision-approval.sql -f /migrations/04-pr-safety-review.sql -f /migrations/05-pr-safety-chat-producer.sql"]
    depends_on:
      db-requests:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- hindsight: agent memory (network service, HTTP :8888 / UI :9999) ---
  # Structure adopted from vectorize-io/hindsight docker/docker-compose/external-pg.
  hindsight-db:
    # Pinned major. hindsight_pgdata is mounted at the pg18 PGDATA path below; changing this tag
    # WITHOUT migrating orphans data silently (older tags e.g. pg16 use a different PGDATA path).
    image: pgvector/pgvector:pg18
    container_name: fleet-hindsight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight_user}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD}
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight_db}
    volumes:
      - hindsight_pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HINDSIGHT_DB_USER:-hindsight_user}"]
      interval: 5s
      timeout: 3s
      retries: 10

  hindsight:
    # Pin a concrete version before relying on this in M1; :latest is non-reproducible.
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-latest}
    container_name: fleet-hindsight
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      # hindsight needs a keyed LLM provider for fact extraction. Keyless subscription providers
      # (claude-code) do not work headless in a container. Set HINDSIGHT_API_LLM_API_KEY in .env.
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_DATABASE_URL: postgresql://${HINDSIGHT_DB_USER:-hindsight_user}:${HINDSIGHT_DB_PASSWORD:?set HINDSIGHT_DB_PASSWORD}@hindsight-db:5432/${HINDSIGHT_DB_NAME:-hindsight_db}
    depends_on:
      hindsight-db:
        condition: service_healthy
    healthcheck:
      # /health returns 200; root (/) is 404. curl is present in the image (verified).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- coderag: graph UI + internal Streamable HTTP MCP bridge ---
  coderag:
    image: agent-fleet/coderag:${CODERAG_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.coderag
      args:
        CBM_REF: ${CBM_REF:-ffb5ebe9e8ad2763fc6388c001ca8a16ca834d88}
    container_name: fleet-coderag
    restart: unless-stopped
    environment:
      CBM_CACHE_DIR: /cache
      CBM_ALLOWED_ROOT: /code
      CBM_UI_PORT: "9749"
      CODERAG_MCP_PORT: "9750"
    volumes:
      - coderag_cache:/cache
      - ${CODE_ROOT:?set CODE_ROOT}:/code:ro
    command: ["serve-all"]
    ports:
      - "127.0.0.1:9749:9749"
    expose:
      - "9750"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9750/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Lexical guard for direct Compose use; scripts/compose.sh also resolves host symlinks.
  swarmvault-preflight:
    image: busybox:1.36
    restart: "no"
    environment:
      CODE_ROOT: ${CODE_ROOT:?set CODE_ROOT}
      SWARMVAULT_VAULT: ${SWARMVAULT_VAULT:?set SWARMVAULT_VAULT outside CODE_ROOT}
    volumes:
      - ./docker/swarmvault-preflight.sh:/usr/local/bin/swarmvault-preflight:ro
    command: ["/usr/local/bin/swarmvault-preflight"]

  # --- swarmvault: shared doc vault + continuous inbox watcher ---
  swarmvault-watch:
    image: agent-fleet/swarmvault:${SWARMVAULT_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.swarmvault
      args:
        SWARMVAULT_REF: ${SWARMVAULT_REF:-815412d24298e59e5073ded1ddd6c0e6aee9b91b}
    container_name: fleet-swarmvault-watch
    restart: unless-stopped
    volumes:
      - ${SWARMVAULT_VAULT:?set SWARMVAULT_VAULT outside CODE_ROOT}:/vault
    working_dir: /vault
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/swarmvault.config.json && test -s /vault/state/watcher.pid && kill -0 $$(cat /vault/state/watcher.pid)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      swarmvault-preflight:
        condition: service_completed_successfully

  # --- swarmvault: read-only Streamable HTTP MCP bridge ---
  swarmvault-mcp:
    image: agent-fleet/swarmvault:${SWARMVAULT_VERSION:-latest}
    container_name: fleet-swarmvault-mcp
    restart: unless-stopped
    environment:
      SWARMVAULT_MCP_PORT: "9760"
    volumes:
      - ${SWARMVAULT_VAULT:?set SWARMVAULT_VAULT outside CODE_ROOT}:/vault:ro
    working_dir: /vault
    command: ["serve-mcp"]
    expose:
      - "9760"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9760/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      swarmvault-watch:
        condition: service_healthy

  # --- agent-servers: one SERIAL worker container per KIND ---
  # Compose by kind, not by replicas. Each holds its own per-kind advisory lock and claims only its
  # own kind's rows. Add a new kind = add a service (copy a block, change AGENT_SERVER_KIND).
  # They reach the substrate by SERVICE NAME (db-requests / hindsight), not localhost.
  # Secrets (REQUESTS_DB_PASSWORD, GH_TOKEN, OPENAI_API_KEY) come from .env via env_file.
  agent-server-review:
    image: agent-fleet/agent-server:${AGENT_SERVER_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.agent-server
    container_name: fleet-agent-server-review
    restart: unless-stopped
    env_file: .env                      # GH_TOKEN, OPENAI_API_KEY, REQUESTS_DB_PASSWORD, ...
    environment:
      AGENT_SERVER_KIND: pr-review
      AGENT_SERVER_RUNNER: /app/bin/mewritecode-runner.sh
      AGENT_SERVER_SHARED_BANK: fleet-shared
      REQUESTS_DB_HOST: db-requests       # in-network service name, NOT localhost
      REQUESTS_DB_PORT: "5432"
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      HINDSIGHT_URL: http://hindsight:8888
    volumes:
      - ${CODE_ROOT:?set CODE_ROOT}:${CODE_ROOT}:rw          # same path in-container so worktrees resolve
      - ${CODE_ROOT}/_roktcode-worktrees:${CODE_ROOT}/_roktcode-worktrees:rw
    depends_on:
      db-requests:
        condition: service_healthy
      hindsight:
        condition: service_healthy

  # Second kind: identical except AGENT_SERVER_KIND. maintain PRs push fix commits, so its GH_TOKEN
  # (in .env, or a kind-specific token) needs Contents:write; review's token can stay read-only.
  agent-server-maintain:
    image: agent-fleet/agent-server:${AGENT_SERVER_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.agent-server
    container_name: fleet-agent-server-maintain
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_SERVER_KIND: pr-maintain
      AGENT_SERVER_RUNNER: /app/bin/mewritecode-runner.sh
      AGENT_SERVER_SHARED_BANK: fleet-shared
      REQUESTS_DB_HOST: db-requests
      REQUESTS_DB_PORT: "5432"
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      HINDSIGHT_URL: http://hindsight:8888
    volumes:
      - ${CODE_ROOT:?set CODE_ROOT}:${CODE_ROOT}:rw
      - ${CODE_ROOT}/_roktcode-worktrees:${CODE_ROOT}/_roktcode-worktrees:rw
    depends_on:
      db-requests:
        condition: service_healthy
      hindsight:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully

  # Build-only image used by pr-safety-review-runner's per-operation `docker run`.
  # It receives only OPENAI_API_KEY, read-only snapshot/policy mounts, and one writable handoff file.
  pr-safety-analyst-image:
    image: agent-fleet/pr-safety-analyst:${PR_SAFETY_ANALYST_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.pr-safety-analyst
    restart: "no"
    entrypoint: ["true"]

  # Draft-only controller. It can access local Postgres and Docker to start the isolated analyst,
  # but it has no GitHub/Chat/CI/Datadog integration and makes no external write.
  pr-safety-review-controller:
    profiles: ["pr-safety"]
    image: agent-fleet/pr-safety-controller:${PR_SAFETY_CONTROLLER_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.pr-safety-controller
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PR_SAFETY_ANALYST_RUNNER: /app/bin/pr-safety-review-runner
      PR_SAFETY_ANALYST_IMAGE: agent-fleet/pr-safety-analyst:${PR_SAFETY_ANALYST_VERSION:-latest}
      REQUESTS_DB_HOST: db-requests
      REQUESTS_DB_PORT: "5432"
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      PR_SAFETY_SNAPSHOT_ROOT: ${PR_SAFETY_SNAPSHOT_ROOT:-/var/empty}
      PR_SAFETY_POLICY_ROOT: ${PR_SAFETY_POLICY_ROOT:-/var/empty}
      PR_SAFETY_WORK_ROOT: ${PR_SAFETY_WORK_ROOT:-/var/empty}
      HANDOFF_ROOT: ${HANDOFF_ROOT:-/var/empty}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PR_SAFETY_SNAPSHOT_ROOT:-/var/empty}:${PR_SAFETY_SNAPSHOT_ROOT:-/var/empty}:ro
      - ${PR_SAFETY_POLICY_ROOT:-/var/empty}:${PR_SAFETY_POLICY_ROOT:-/var/empty}:ro
      - ${PR_SAFETY_WORK_ROOT:-/var/empty}:${PR_SAFETY_WORK_ROOT:-/var/empty}:rw
      - ${HANDOFF_ROOT:-/var/empty}:${HANDOFF_ROOT:-/var/empty}:rw
    depends_on:
      db-requests:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
      pr-safety-analyst-image:
        condition: service_completed_successfully

  # --- status: local web view (M3) ---
  # Renders running/queued/recent plus the human-review queue. Queue controls only update local
  # maintenance-review state; the port stays bound to LOCALHOST because there is no auth.
  status:
    image: agent-fleet/status:${STATUS_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.status
    container_name: fleet-status
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STATUS_PORT:-8080}:8080"
    environment:
      REQUESTS_DB_HOST: db-requests
      REQUESTS_DB_PORT: "5432"
      REQUESTS_DB_USER: ${REQUESTS_DB_USER:-fleet}
      REQUESTS_DB_NAME: ${REQUESTS_DB_NAME:-fleet}
      PGPASSWORD: ${REQUESTS_DB_PASSWORD:?set REQUESTS_DB_PASSWORD}
      PR_PRODUCER_REPOSITORIES: ${PR_PRODUCER_REPOSITORIES:-}
      PR_PRODUCER_ORGS: ${PR_PRODUCER_ORGS:-}
      PR_PRODUCER_ALLOW_ALL_REPOS: ${PR_PRODUCER_ALLOW_ALL_REPOS:-false}
      HINDSIGHT_URL: http://hindsight:8888
      STATUS_BIND: 0.0.0.0
    depends_on:
      db-requests:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully

volumes:
  requests_pgdata:
  redisdata:
  hindsight_pgdata:
  coderag_cache:
