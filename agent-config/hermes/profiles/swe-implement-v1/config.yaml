gateway:
  api_server:
    enabled: false
terminal:
  env_passthrough: [GH_CONFIG_DIR]
model:
  provider: anthropic
  default: claude-sonnet-4-6
memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
skills:
  creation_nudge_interval: 0
agent:
  disabled_toolsets: [delegation]
  max_turns: 100
  run_budget_seconds: 2400
  api_max_retries: 0
