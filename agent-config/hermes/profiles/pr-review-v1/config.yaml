gateway:
  api_server:
    enabled: false
terminal:
  env_passthrough: [GH_CONFIG_DIR]
mcp_servers:
  memory-recall:
    command: python3
    args: [/usr/local/libexec/ai-pr-automation/hermes-memory-recall-shim]
    env:
      HERMES_MEMORY_BACKEND: hindsight
  coderag:
    url: http://127.0.0.1:9750/mcp
model:
  provider: anthropic
  default: claude-sonnet-4-6
memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
skills:
  creation_nudge_interval: 0
agent:
  disabled_toolsets: [delegation]
  max_turns: 60
  run_budget_seconds: 1800
  api_max_retries: 0
