gateway:
  api_server:
    enabled: false
terminal:
  env_passthrough: [GH_CONFIG_DIR]
platform_toolsets:
  cli: [terminal, file, kanban, skills]
model:
  provider: openai-codex
  default: gpt-6-sol
memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
skills:
  creation_nudge_interval: 0
agent:
  disabled_toolsets: [delegation, memory, browser, web, computer_use, code_execution, vision, image_gen, tts, todo, connections]
  max_turns: 60
  run_budget_seconds: 1800
  api_max_retries: 0
